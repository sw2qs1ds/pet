<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>pet · 原型</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1117; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #1a2233 0%, #0e1117 60%, #080a0f 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #pet { position: fixed; inset: 0; }
  #pet canvas { display: block; width: 100%; height: 100%; }
  #bubble {
    position: fixed; transform: translate(-50%, -100%) scale(.92);
    max-width: min(70vw, 320px); padding: 10px 14px;
    background: #fff; color: #10131a; border-radius: 14px;
    font-size: 15px; line-height: 1.45; white-space: pre-wrap;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  }
  #bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px;
    background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 2px;
  }
  #composer {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    display: flex; gap: 8px; align-items: center;
    padding: 8px; border-radius: 16px;
    background: rgba(20, 26, 38, .86); backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 150, 220, .18);
  }
  #composer input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: #e8eeff; font-size: 15px; padding: 8px 6px;
  }
  #composer input::placeholder { color: #6d7c99; }
  #composer button {
    border: 0; border-radius: 12px; padding: 9px 14px; font-size: 14px;
    background: #3f63e8; color: #fff; font-weight: 600;
  }
  #composer button:disabled { opacity: .5; }
  #hint {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    color: #7c8aa5; font-size: 12px; letter-spacing: .02em; pointer-events: none;
    transition: opacity .6s ease;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
  <div id="pet"><canvas id="stage"></canvas></div>
  <div id="bubble"></div>
  <div id="composer">
    <input id="say" placeholder="跟它说点什么…" autocomplete="off">
    <button id="send">说</button>
  </div>
  <div id="hint">点它一下 · 拖它试试</div>
  <script src="./brain.js"></script>
  <script src="./app.js"></script>
</body>
</html>
